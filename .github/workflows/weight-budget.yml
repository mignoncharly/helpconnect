name: Weight budgets

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: weight-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weight-budget:
    name: Build and enforce Brotli budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate weight gate
        run: npm run weight:validate
      - name: Build, minify, compress, measure, and compare
        run: npm run weight:ci
      - name: Preserve weight report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weight-report
          path: reports/weight-report.json
          archive: false
          if-no-files-found: warn
          retention-days: 14
